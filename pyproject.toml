[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyhub"
version = "0.5.0a1"
description = "Modular, namespaced VPS and proxy management"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = []

[project.scripts]
proxyhub = "proxyhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
